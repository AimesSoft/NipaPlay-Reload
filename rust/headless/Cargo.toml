[package]
name = "nipaplay-headless-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["headless"]
headless = []

[dependencies]
flutter_rust_bridge = "=2.12.0"
nipaplay-mesh = { path = "../mesh" }
base64 = "0.22.1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
serde = "1"
futures-util = "0.3.32"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }

[patch.crates-io]
librqbit-dualstack-sockets = { path = "../third_party/librqbit-dualstack-sockets" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(feature, values("ohos"))'] }
