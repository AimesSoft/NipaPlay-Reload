<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">iOS 横屏播放器左右安全区域示意</title>
  <desc id="desc">两个横屏播放器示意图分别展示刘海位于左侧和右侧时，顶部按钮和底部控制栏位于安全区域内。</desc>
  <defs>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252f48"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#202b44"/>
    </linearGradient>
    <pattern id="safe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#e76b6b" fill-opacity=".17"/>
      <rect width="3" height="12" fill="#f49d9d" fill-opacity=".15"/>
    </pattern>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .heading { fill: #eef2ff; font-size: 28px; font-weight: 700; }
      .sub { fill: #aab7d1; font-size: 16px; }
      .label { fill: #dce7fa; font-size: 19px; font-weight: 600; }
      .control { fill: #fff; font-size: 25px; }
      .small { fill: #d9e3f5; font-size: 15px; }
      .guide { stroke: #f4adad; stroke-width: 2; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#0b1020"/>
  <text class="heading" x="40" y="55">iOS 横屏播放 · 左右安全区域</text>
  <text class="sub" x="40" y="85">控件按各侧的 viewPadding 内移，视频画面仍铺满屏幕</text>

  <text class="label" x="40" y="131">刘海 / 灵动岛在左</text>
  <text class="label" x="640" y="131">刘海 / 灵动岛在右</text>

  <rect x="40" y="150" width="520" height="292" rx="22" fill="url(#video)" stroke="#64748b" stroke-width="2"/>
  <clipPath id="leftClip"><rect x="40" y="150" width="520" height="292" rx="22"/></clipPath>
  <g clip-path="url(#leftClip)">
    <rect x="40" y="150" width="66" height="292" fill="url(#safe)"/>
    <line class="guide" x1="106" y1="150" x2="106" y2="442"/>
    <rect x="39" y="257" width="27" height="78" rx="14" fill="#030712"/>
    <text class="control" x="128" y="199">‹</text>
    <text class="small" x="163" y="197">正在播放 · 第 01 话</text>
    <text class="control" x="464" y="199">▢</text>
    <text class="control" x="511" y="199">↗</text>
    <line x1="127" y1="376" x2="519" y2="376" stroke="#73839e" stroke-width="5" stroke-linecap="round"/>
    <line x1="127" y1="376" x2="299" y2="376" stroke="#ea76a6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="299" cy="376" r="6" fill="#fff"/>
    <text class="control" x="128" y="417">⏮</text>
    <text class="control" x="189" y="417">◀</text>
    <text class="control" x="250" y="417">Ⅱ</text>
    <text class="control" x="311" y="417">▶</text>
    <text class="small" x="415" y="413">03:20 / 24:00</text>
  </g>

  <rect x="640" y="150" width="520" height="292" rx="22" fill="url(#video)" stroke="#64748b" stroke-width="2"/>
  <clipPath id="rightClip"><rect x="640" y="150" width="520" height="292" rx="22"/></clipPath>
  <g clip-path="url(#rightClip)">
    <rect x="1094" y="150" width="66" height="292" fill="url(#safe)"/>
    <line class="guide" x1="1094" y1="150" x2="1094" y2="442"/>
    <rect x="1134" y="257" width="27" height="78" rx="14" fill="#030712"/>
    <text class="control" x="679" y="199">‹</text>
    <text class="small" x="714" y="197">正在播放 · 第 01 话</text>
    <text class="control" x="999" y="199">▢</text>
    <text class="control" x="1046" y="199">↗</text>
    <line x1="679" y1="376" x2="1073" y2="376" stroke="#73839e" stroke-width="5" stroke-linecap="round"/>
    <line x1="679" y1="376" x2="850" y2="376" stroke="#ea76a6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="850" cy="376" r="6" fill="#fff"/>
    <text class="control" x="679" y="417">⏮</text>
    <text class="control" x="740" y="417">◀</text>
    <text class="control" x="801" y="417">Ⅱ</text>
    <text class="control" x="862" y="417">▶</text>
    <text class="small" x="967" y="413">03:20 / 24:00</text>
  </g>

  <rect x="40" y="474" width="17" height="17" fill="url(#safe)" stroke="#f4adad"/>
  <text class="sub" x="68" y="489">系统安全区域</text>
  <line class="guide" x1="239" y1="482" x2="276" y2="482"/>
  <text class="sub" x="285" y="489">控件布局边界</text>
  <text class="sub" x="921" y="489">布局示意 · 非模拟器截图</text>
</svg>
