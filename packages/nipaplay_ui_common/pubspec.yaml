name: nipaplay_ui_common
description: "NipaPlay shared UI layer: display-surface contracts, l10n, data-driven settings/media-library models, self-contained widgets. No app-state dependencies."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_markdown: ^0.7.1
  markdown: ^7.0.0
  glassmorphism: ^3.0.0
  nipaplay_core:
    path: ../nipaplay_core
