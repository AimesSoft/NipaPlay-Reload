name: desktop_multi_window
description: NipaPlay fork that creates same-engine desktop Flutter views.
version: 0.3.0-nipaplay.1
publish_to: none

environment:
  sdk: ^3.5.3
  # The HarmonyOS Flutter fork is currently based on Flutter 3.35. The public
  # facade remains available there, while the 3.44 windowing implementation is
  # selected only by builds that opt into it.
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
