# HarmonyOS-only dependency graph.
#
# Activate before using the OpenHarmony Flutter SDK:
#   dart run tool/configure_flutter_dependencies.dart ohos
#
# The generated pubspec_overrides.yaml is intentionally ignored so upstream
# Flutter developers keep the normal cross-platform dependency graph.
# Pub treats this section as a replacement rather than a per-package merge, so
# the shared overrides from pubspec.yaml are repeated below the OHOS entries.
dependency_overrides:
  # The OpenHarmony Flutter fork is currently based on Flutter 3.35 and does
  # not expose the private same-engine windowing APIs added in Flutter 3.44.
  desktop_multi_window:
    path: packages/desktop_multi_window_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_shared_preferences-v2.5.4_ohos
      path: packages/shared_preferences/shared_preferences
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_path_provider-v2.1.5_ohos
      path: packages/path_provider/path_provider
  file_selector:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_file_selector-v1.1.0_ohos
      path: packages/file_selector/file_selector
  # The upstream OHOS implementation never completes the platform call when
  # DocumentViewPicker returns an empty list after cancellation.
  file_selector_ohos:
    path: packages/file_selector_ohos
  image_picker:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_image_picker-v1.2.1_ohos
      path: packages/image_picker/image_picker
  url_launcher:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_url_launcher-v6.3.2_ohos
      path: packages/url_launcher/url_launcher
  package_info_plus:
    git:
      url: https://gitee.com/openharmony-sig/flutter_plus_plugins.git
      ref: br_package_info_plus-v8.1.0_ohos
      path: packages/package_info_plus/package_info_plus
  # The tvOS registrant packages are native-only, but their current metadata
  # requests platform-interface releases that require a newer Dart SDK. Keep
  # the HarmonyOS 3.35 graph on the interfaces used by its adapted plugins.
  package_info_plus_platform_interface: 3.2.1
  sqflite:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_sqflite.git
      ref: br_v2.4.2_ohos
      path: sqflite
  mobile_scanner:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_mobile_scanner.git
      ref: br_v7.1.4_ohos
  wakelock_plus:
    git:
      url: https://gitee.com/openharmony-sig/fluttertpc_wakelock_plus.git
      ref: br_wakelock_plus_1.2.8_ohos
      path: wakelock_plus
  wakelock_plus_platform_interface: 1.3.0
  # FVP 0.37.3 calls ResourceManager as a function; API 18 exposes it as a
  # property. Keep the fix local until it is released upstream.
  fvp:
    path: packages/fvp-0.37.3
  # Adds a fallback branch for TargetPlatform.ohos.
  fluent_ui:
    path: packages/fluent_ui-4.15.1
  # Shared repository overrides. Keep these keys aligned with pubspec.yaml.
  liquid_glass_widgets:
    path: packages/liquid_glass_widgets
  media_kit:
    path: packages/media_kit
  media_kit_video:
    path: packages/media_kit_video
  media_kit_libs_video:
    path: third_party/media-kit-upstream/libs/universal/media_kit_libs_video
  adaptive_platform_ui:
    path: packages/adaptive_platform_ui
  media_kit_libs_linux:
    path: third_party/media-kit-upstream/libs/linux/media_kit_libs_linux
  media_kit_libs_ios_video:
    path: third_party/media-kit-upstream/libs/ios/media_kit_libs_ios_video
  media_kit_libs_android_video:
    path: third_party/media-kit-upstream/libs/android/media_kit_libs_android_video
  media_kit_libs_windows_video:
    path: third_party/media-kit-upstream/libs/windows/media_kit_libs_windows_video
  media_kit_libs_macos_video:
    path: third_party/media-kit-upstream/libs/macos/media_kit_libs_macos_video
  smb_connect:
    path: third_party/smb_connect
  kmbal_ionicons:
    path: third_party/kmbal_ionicons
  volume_controller:
    path: third_party/volume_controller
