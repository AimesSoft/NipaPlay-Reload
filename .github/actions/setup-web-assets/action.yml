name: Set up embedded Web assets
description: Restore the release Web bundle or build it for standalone jobs
inputs:
  artifact-name:
    description: Same-run artifact containing web.tar; empty builds locally
    default: ''
runs:
  using: composite
  steps:
    - name: Download prebuilt Web assets
      if: inputs.artifact-name != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/nipaplay-web-assets

    - name: Restore prebuilt Web assets
      if: inputs.artifact-name != ''
      shell: bash
      run: |
        rm -rf assets/web
        mkdir -p assets/web
        tar -xf - -C assets/web < "$RUNNER_TEMP/nipaplay-web-assets/web.tar"
        test -f assets/web/index.html || test -f assets/web/.gitkeep

    - name: Build Web and copy assets
      if: inputs.artifact-name == ''
      shell: bash
      run: bash build_and_copy_web.sh
