name: Release CI Smoke

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: 'Run Flutter analyze/test gate'
        default: true
        required: true
        type: boolean
      run_windows:
        description: 'Run Windows release build, including Erika native core'
        default: false
        required: true
        type: boolean
      run_linux:
        description: 'Run Linux amd64 release build'
        default: false
        required: true
        type: boolean
      run_ios:
        description: 'Run unsigned iOS release build, including the Rust core'
        default: false
        required: true
        type: boolean
      run_web:
        description: 'Run browser regression tests and embedded Web release build'
        default: false
        required: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: release-ci-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and Test
    if: inputs.run_validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter Environment
        uses: ./.github/actions/setup-flutter

      - name: Generate build info json
        run: python3 .github/workflows/scripts/generate-build-info-json.py assets/build_info.json

      - name: Run flutter analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib

      - name: Detect root test files
        id: detect_tests
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run flutter test
        if: steps.detect_tests.outputs.has_tests == 'true'
        run: flutter test --no-pub --reporter expanded

      - name: Skip flutter test
        if: steps.detect_tests.outputs.has_tests != 'true'
        run: echo "No root-level *_test.dart files found. Skipping flutter test."

  build-windows:
    name: Windows Release Build
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows
    uses: ./.github/workflows/build-windows.yml

  build-linux:
    name: Linux amd64 Release Build
    if: github.event_name == 'workflow_dispatch' && inputs.run_linux
    uses: ./.github/workflows/build-linux.yml

  build-ios:
    name: iOS Release Build
    if: github.event_name == 'workflow_dispatch' && inputs.run_ios
    uses: ./.github/workflows/build-ios.yml

  build-web:
    name: Embedded Web Release Build
    if: github.event_name == 'workflow_dispatch' && inputs.run_web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter Environment
        uses: ./.github/actions/setup-flutter

      - name: Generate build info json
        run: python3 .github/workflows/scripts/generate-build-info-json.py assets/build_info.json

      - name: Run browser regression tests
        run: flutter test --no-pub --platform chrome test/potplayer_web_test.dart

      - name: Build embedded Web application
        run: flutter build web --no-pub
