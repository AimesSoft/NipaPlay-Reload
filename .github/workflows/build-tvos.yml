name: Build tvOS

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NIPAPLAY_TMDB_TOKEN:
        required: false
    outputs:
      version:
        description: Application version from pubspec.yaml
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: Uploaded tvOS build artifact
        value: ${{ jobs.build.outputs.artifact-name }}
  pull_request:
    paths:
      - '.flutter-version-tvos'
      - '.github/workflows/build-tvos.yml'
      - 'lib/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'pubspec_overrides.tvos.yaml'
      - 'third_party/**'
      - 'tool/**'
      - 'tvos/**'
      - 'rust/tvos/**'
      - 'rust/src/api/mesh.rs'
      - 'rust/src/mesh/**'
      - 'rust_builder/tvos/**'

permissions:
  contents: read

concurrency:
  group: build-tvos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tvOS package
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NIPAPLAY_TMDB_TOKEN: ${{ secrets.NIPAPLAY_TMDB_TOKEN }}
      CARGO_BUILD_JOBS: '2'
    outputs:
      version: ${{ steps.project.outputs.version }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read project versions
        id: project
        shell: bash
        run: |
          echo "flutter-tvos=$(tr -d '[:space:]' < .flutter-version-tvos)" >> "$GITHUB_OUTPUT"
          echo "version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          echo "FLUTTER_TVOS_ROOT=$RUNNER_TEMP/flutter-tvos" >> "$GITHUB_ENV"

      - name: Cache flutter-tvos artifacts and Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/flutter-tvos/engine_artifacts
            ${{ runner.temp }}/flutter-tvos/flutter/bin/cache
            ~/.pub-cache
          key: tvos-${{ runner.os }}-${{ steps.project.outputs.flutter-tvos }}-${{ hashFiles('pubspec.lock', 'pubspec_overrides.tvos.yaml') }}-v1
          restore-keys: |
            tvos-${{ runner.os }}-${{ steps.project.outputs.flutter-tvos }}-

      - name: Install pinned flutter-tvos SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FLUTTER_TVOS_ROOT"
          if [[ ! -d "$FLUTTER_TVOS_ROOT/.git" ]]; then
            git -C "$FLUTTER_TVOS_ROOT" init
            git -C "$FLUTTER_TVOS_ROOT" remote add origin \
              https://github.com/fluttertv/flutter-tvos.git
          else
            git -C "$FLUTTER_TVOS_ROOT" remote set-url origin \
              https://github.com/fluttertv/flutter-tvos.git
          fi
          git -C "$FLUTTER_TVOS_ROOT" fetch \
            --depth 1 \
            origin \
            'refs/tags/${{ steps.project.outputs.flutter-tvos }}'
          git -C "$FLUTTER_TVOS_ROOT" checkout --detach --force FETCH_HEAD

          # The cache restores flutter/bin/cache without the Flutter checkout.
          # Recreate the pinned checkout in place so flutter-tvos can reuse the
          # cached artifacts instead of rejecting flutter/ as a non-Git folder.
          flutter_revision="$(tr -d '[:space:]' < \
            "$FLUTTER_TVOS_ROOT/bin/internal/flutter.version")"
          flutter_sdk_root="$FLUTTER_TVOS_ROOT/flutter"
          mkdir -p "$flutter_sdk_root"
          if [[ ! -d "$flutter_sdk_root/.git" ]]; then
            git -C "$flutter_sdk_root" init
            git -C "$flutter_sdk_root" remote add origin \
              https://github.com/flutter/flutter.git
          else
            git -C "$flutter_sdk_root" remote set-url origin \
              https://github.com/flutter/flutter.git
          fi
          # Flutter derives its SDK version from Git tags. Match the upstream
          # flutter-tvos bootstrap so pub does not see 0.0.0-unknown.
          git -C "$flutter_sdk_root" fetch \
            --depth 1 --quiet --tags origin "$flutter_revision"
          git -C "$flutter_sdk_root" checkout --detach --force FETCH_HEAD
          test "$(git -C "$flutter_sdk_root" rev-parse HEAD)" = \
            "$flutter_revision"

          "$FLUTTER_TVOS_ROOT/bin/flutter-tvos" precache
          "$FLUTTER_TVOS_ROOT/bin/flutter-tvos" --version

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_TVOS_ROOT/flutter/bin/dart" \
            run tool/configure_flutter_dependencies.dart tvos
          "$FLUTTER_TVOS_ROOT/bin/flutter-tvos" pub get

      - name: Install Rust for the television Mesh transport
        shell: bash
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Prepare built-in credentials
        shell: bash
        run: python3 .github/workflows/scripts/built-in-credentials.py prepare "$RUNNER_TEMP/nipaplay-tvos-defines.json"

      - name: Generate build info json
        shell: bash
        run: python3 .github/workflows/scripts/generate-build-info-json.py assets/build_info.json

      - name: Build tvOS simulator application
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bash tool/build_tvos_unsigned.sh simulator \
            --dart-define-from-file="$RUNNER_TEMP/nipaplay-tvos-defines.json"

      - name: Build unsigned tvOS device application
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bash tool/build_tvos_unsigned.sh device \
            --dart-define-from-file="$RUNNER_TEMP/nipaplay-tvos-defines.json"

      - name: Verify built-in credentials in the compiled application
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            app_path=build/tvos/Release-appletvsimulator/Runner.app
          else
            app_path=build/tvos/Release-appletvos/Runner.app
          fi
          test -s "$app_path/Frameworks/App.framework/App"
          test ! -f "$app_path/flutter_assets/kernel_blob.bin"
          python3 .github/workflows/scripts/built-in-credentials.py verify \
            "$app_path/Frameworks/App.framework/App"
          python3 .github/workflows/scripts/verify-ios-agent-assets.py "$app_path"

      - name: Prepare tvOS artifact
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.project.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            app_path="$(find build/tvos -path '*-appletvsimulator/*.app' -type d -print -quit)"
            if [[ -z "$app_path" ]]; then
              echo "No tvOS simulator .app was produced." >&2
              find build -maxdepth 5 -print
              exit 1
            fi
            echo "name=release-tvOS-simulator" >> "$GITHUB_OUTPUT"
            echo "path=$app_path" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app_path="$(find build/tvos/Release-appletvos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No tvOS device .app was produced." >&2
            find build -maxdepth 5 -print
            exit 1
          fi

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          executable="$app_path/$executable_name"
          if ! lipo -archs "$executable" | tr ' ' '\n' | grep -qx arm64; then
            echo "tvOS device executable is not arm64: $(lipo -archs "$executable")" >&2
            exit 1
          fi
          if ! xcrun vtool -show-build "$executable" | grep -q 'platform TVOS'; then
            echo "tvOS package does not target physical Apple TV devices." >&2
            xcrun vtool -show-build "$executable" || true
            exit 1
          fi

          mkdir -p dist/Payload
          /usr/bin/ditto "$app_path" "dist/Payload/$(basename "$app_path")"
          ipa_name="NipaPlay-${VERSION}-tvOS-arm64-sideload.ipa"
          (
            cd dist
            /usr/bin/ditto -c -k --keepParent Payload "$ipa_name"
          )
          test -s "dist/$ipa_name"
          shasum -a 256 "dist/$ipa_name" > dist/SHA256SUMS-tvOS

          echo "name=release-tvOS-sideload" >> "$GITHUB_OUTPUT"
          echo "path=dist/$ipa_name" >> "$GITHUB_OUTPUT"

      - name: Upload tvOS simulator application
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-tvOS-simulator
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload tvOS sideload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-tvOS-sideload
          path: |
            ${{ steps.artifact.outputs.path }}
            dist/SHA256SUMS-tvOS
          if-no-files-found: error
          retention-days: 14
